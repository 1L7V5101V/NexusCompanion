db_path = ""

[retrieval]
top_k_history = 8
score_threshold = 0.45
relative_delta = 0.2
procedure_guard_enabled = true

[retrieval.thresholds]
procedure = 0.66
preference = 0.5
event = 0.5
profile = 0.5

[retrieval.inject]
max_chars = 6000
forced = 3
procedure_preference = 4
event_profile = 4
line_max = 600

[retrieval.sparse]
normalization_k = 4.0
hotness_alpha = 0.2

[retrieval.rrf]
k = 60
keyword_weight = 0.5
hotness_beta = 0.05

[retrieval.experimental]
hyde_enabled = false
query_rewrite_enabled = false
reranker_enabled = false
