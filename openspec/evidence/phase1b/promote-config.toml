[storage]
# 后端选择：sqlite（单机默认）/ postgres。
backend = "postgres"
# postgres 后端连接串，支持 ${ENV_VAR}。
postgres_url = "postgresql+psycopg://nexus:nexus_dev@localhost:5433/nexus"
# 连接池大小（5000 用户 / 100 并发 ≈ 50）。
pool_size = 20
